plugins {
    id 'java-library'
    id 'jacoco'
}

compileJava {
    options.release = 11
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation(platform(libs.junit.bom))
    testImplementation(libs.bundles.junit.api)

    testRuntimeOnly(libs.bundles.junit.runtime)
}

test {
    useJUnitPlatform()
}

jar {
    into("META-INF/maven/$project.group/$project.name") {
        from { tasks.named("generatePomFileForMavenPublication") }
        rename ".*", "pom.xml"
    }
}