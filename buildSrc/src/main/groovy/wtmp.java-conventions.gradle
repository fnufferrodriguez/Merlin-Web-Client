plugins {
    id 'java-library'
    id 'java'
    id 'jacoco'
}

// Lock compilation and tests to Java 11 so WAT 1.1 + ResSim 3.5.x can load them
// while still letting you RUN Gradle on a newer JDK via toolchains.
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(11)
  }
}

// Enforce strict cross-compilation targeting Java 11 classfile level (55.0)
tasks.withType(JavaCompile).configureEach {
  options.release = 11
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation(platform(libs.junit.bom))
    testImplementation(libs.bundles.junit.api)

    testRuntimeOnly(libs.bundles.junit.runtime)
}

test {
    useJUnitPlatform()
}

jar {
    into("META-INF/maven/$project.group/$project.name") {
        from { tasks.named("generatePomFileForMavenPublication") }
        rename ".*", "pom.xml"
    }
}